# SPDX-License-Identifier: MPL-2.0
name: Python suites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag is mutable, and this workflow runs with a
# checkout of the repository it is protecting. The comment after each SHA records which release
# it was, so an upgrade is a deliberate edit rather than an invisible retag.
jobs:
  root-suite:
    name: root suite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu spans the floor and the current interpreters.
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.14"}
          # macOS gets a current interpreter here; its 3.9 floor is covered by the
          # system-interpreter job below, which is a truer test of the documented install path
          # than setup-python would be. (The last x86 macOS image, where setup-python still
          # published 3.9, has been retired by GitHub, so that leg cannot exist any more.)
          - {os: macos-latest, python: "3.12"}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Configure a Git identity for the suites that build repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Root suite
        run: python -m pytest -p no:cacheprovider
      - name: Nested Codex suite
        working-directory: plugins/reviewer-agent-codex
        run: python -m pytest -p no:cacheprovider
      - name: No artifacts were left behind
        run: |
          git status --porcelain --untracked-files=all > /tmp/dirty.txt
          if [ -s /tmp/dirty.txt ]; then
            echo "the suites left the working tree dirty:"
            cat /tmp/dirty.txt
            exit 1
          fi

  macos-system-python:
    # The install path this project actually documents on macOS: no user-installed Python, no
    # setup-python, just /usr/bin/python3 -- which is why the runtime is standard-library-only
    # and why 3.9 is the floor. Running the suites through anything else would test a machine
    # no user has to have.
    name: macOS system interpreter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The system interpreter is still the documented floor
        # EXACTLY 3.9, not "at least". The point of this job is to exercise the version the
        # README promises support for; if the image ships something newer, `>=` would keep
        # passing while the floor went untested. Failing here is the intended signal that the
        # platform moved and the documented floor needs a deliberate decision.
        run: |
          /usr/bin/python3 --version
          /usr/bin/python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 9):
              raise SystemExit(
                  "macOS system python is {}.{}, not the documented 3.9 floor. Decide "
                  "deliberately: either raise PYTHON_MIN in host_versions.py and the README, "
                  "or pin this job to an image that still ships 3.9.".format(*sys.version_info[:2])
              )
          print("system interpreter {}.{} matches the documented floor".format(*sys.version_info[:2]))
          PY
      - name: Development dependencies in a virtual environment
        # A venv, because the system interpreter's site-packages is not writable and must not
        # be modified. The suites themselves still run on that interpreter.
        run: |
          /usr/bin/python3 -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --upgrade pip
          /tmp/venv/bin/python -m pip install -r requirements-dev.txt
      - name: Configure a Git identity for the suites that build repositories
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Root suite
        run: /tmp/venv/bin/python -m pytest -p no:cacheprovider
      - name: Nested Codex suite
        working-directory: plugins/reviewer-agent-codex
        run: /tmp/venv/bin/python -m pytest -p no:cacheprovider

  structure:
    name: structure, versions, licence and export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # FULL history, deliberately. `scan_release.py` refuses content that quotes a commit
          # id from the private history, and it decides that by resolving the id against local
          # history -- under the default shallow checkout, every older id resolves to "unknown"
          # and the check silently passes on exactly the leak it exists to catch.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Module layering stays acyclic
        run: python3 tools/check_split_layering.py
      - name: Every declared version normalizes to one release
        run: python3 tools/release_versions.py
      - name: Nothing private is about to be published
        run: python3 tools/scan_release.py
      - name: The export builds, verifies and is itself clean
        run: |
          python3 tools/release_export.py --target /tmp/export --archive /tmp/export.tar.gz
          python3 tools/scan_release.py --path /tmp/export --no-commit-check
      - name: The archive is byte-reproducible
        run: |
          python3 - <<'PY'
          import pathlib, shutil, subprocess, sys
          sys.path.insert(0, "tools")
          import release_export as rex
          second = pathlib.Path("/tmp/export-again")
          shutil.rmtree(second, ignore_errors=True)
          rex.export(second)
          rex.write_archive(second, "/tmp/export-again.tar.gz")
          first = pathlib.Path("/tmp/export.tar.gz").read_bytes()
          again = pathlib.Path("/tmp/export-again.tar.gz").read_bytes()
          if first != again:
              raise SystemExit("the export archive is not reproducible")
          print("archive reproducible: {} bytes".format(len(first)))
          PY
      - name: Distribution, licence, version and policy contracts
        run: |
          python -m pytest -p no:cacheprovider \
            tests/test_repository_distribution.py \
            tests/test_release_metadata.py \
            tests/test_license_metadata.py \
            tests/test_release_export.py \
            tests/test_public_documents.py \
            tests/test_host_versions.py
      - name: Codex plugin structural contract
        working-directory: plugins/reviewer-agent-codex
        run: python -m pytest -p no:cacheprovider tests/test_plugin_contract.py
