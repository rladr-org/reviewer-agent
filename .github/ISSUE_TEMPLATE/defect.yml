name: Defect
description: The reviewer did something wrong, or did nothing when it should have acted.
labels: ["defect"]
body:
  - type: markdown
    attributes:
      value: |
        For anything security-sensitive, use private vulnerability reporting instead
        (Security → Report a vulnerability). See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
      placeholder: |
        Ran `git commit -m "..."` with three files staged. Expected a verdict; the commit was
        blocked with "no verdict (exit 0, empty output)" instead.
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Developer host
      options:
        - Claude Code
        - Codex
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Reviewer backend
      options:
        - Codex
        - Pi
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: Which capability
      options:
        - Commit gate
        - stopContinue supervision
        - Timed-out AskUserQuestion answer
        - A slash command or plugin control
        - Something else
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        Output of `claude --version` and/or `codex --version`, `python3 --version`, and the
        plugin version from `.claude-plugin/plugin.json` or
        `plugins/reviewer-agent-codex/.codex-plugin/plugin.json`.
      render: text
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model and effort
      description: What `/reviewerModel` reports (Claude Code) or `$reviewer-agent-codex:reviewer-model` (Codex).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Diagnostics
      description: >
        Claude Code: the relevant lines from `~/.claude/reviewer-agent/logs/reviewer.log`.
        Codex: the `review_commit` or `stop_continue` tool result text — the Codex package
        writes no log file. For a COMMIT review there is also a retained entry under
        `~/.codex/reviewer-agent-codex/reviews/`, which
        `$reviewer-agent-codex:reviewer-history status` locates; stop supervision persists no
        such entry, so its tool result is the only record. Please review before pasting: both
        contain excerpts of the verdict and of your repository's paths.
      render: text
  - type: checkboxes
    id: reproducible
    attributes:
      label: Reproducibility
      options:
        - label: It happens repeatedly, not once
        - label: It happens in a fresh session
        - label: It happens in more than one repository
