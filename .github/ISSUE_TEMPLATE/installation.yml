name: Installation failure
description: Installing, updating, disabling or uninstalling did not work.
labels: ["installation"]
body:
  - type: dropdown
    id: step
    attributes:
      label: Which step
      options:
        - Install
        - Update
        - Disable
        - Uninstall
        - Reinstall after an uninstall
        - Pi extension installation
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Which route
      options:
        - Agent-assisted (INSTALL_WITH_AGENT.md)
        - Manual, Claude Code
        - Manual, Codex (scripts/install_local.py)
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command and its output
      render: text
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        `claude --version` and/or `codex --version`, `python3 --version`, `node --version` if Pi
        is involved, and your OS. This release was validated against Claude Code 2.1.238, Codex
        0.147.0, Node 22.19 and Python 3.9; the installer warns below those.
      render: text
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Pre-existing state
      description: >
        Was this a clean host? Had an earlier version been installed? Is the legacy standalone
        Claude Code install (hooks in ~/.claude/settings.json) also present?
