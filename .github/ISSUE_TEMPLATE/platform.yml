name: Platform compatibility
description: A problem specific to Linux, WSL2, or another platform.
labels: ["platform"]
body:
  - type: markdown
    attributes:
      value: |
        macOS is manually validated end to end. Linux is exercised by CI unit tests only and has
        no clean-host validation. WSL2 is unverified. Native Windows and WSL1 are not supported.
        Reports from Linux and WSL2 are wanted — that is how those move off "beta".
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (native)
        - Windows through WSL2
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution and version
      placeholder: "Ubuntu 24.04, or macOS 15.2, or WSL2 with Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What is platform-specific about it
      description: >
        What failed, and what makes you think the platform is the cause — a path shape, a
        missing binary, process handling, sandboxing.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: "`claude --version` and/or `codex --version`, `python3 --version`, `uname -a`."
      render: text
    validations:
      required: true
  - type: checkboxes
    id: wsl
    attributes:
      label: If WSL
      options:
        - label: "`wsl --list --verbose` shows version 2 for this distribution"
        - label: The repository lives inside the Linux filesystem, not under /mnt/c
