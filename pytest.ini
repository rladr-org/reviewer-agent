# Root pytest configuration.
#
# Without this file a bare `pytest` at the repository root also collects
# `plugins/reviewer-agent-codex/tests/`, whose modules import `reviewer_codex` relative to
# the plugin directory rather than the repository root, and collection fails. The two
# suites are independent and have separate canonical commands:
#
#   python3 -m pytest -p no:cacheprovider                      # from the repository root
#   python3 -m pytest -p no:cacheprovider                      # from plugins/reviewer-agent-codex/
#
# The nested suite keeps its own configuration in
# `plugins/reviewer-agent-codex/pyproject.toml`; pytest finds that file first when invoked
# from the plugin directory, so this file never applies there.
[pytest]
testpaths = tests
norecursedirs = plugins pi-extensions docs .git __pycache__ node_modules
markers =
    smoke: fast install-time subset (AGENT_INSTALL.md step 3); must stay under a minute
